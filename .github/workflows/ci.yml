name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests et qualite
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verifier la syntaxe (ruff)
        run: |
          pip install ruff
          ruff check src tests --output-format=github

      - name: Lancer les tests
        run: pytest -v

      - name: Verifier que l'API demarre
        run: |
          python -c "
          import ast, pathlib
          ast.parse(pathlib.Path('src/api.py').read_text())
          print('src/api.py : syntaxe valide')
          "

  docker:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: eco2mix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
