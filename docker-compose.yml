services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      # 'api' est le nom du service : Docker resout ce nom en interne
      API_URL: http://api:8000
    volumes:
      - ./data:/app/data
    command: >
      streamlit run src/dashboard.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prefect-server:
    build: .
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/app/.prefect
    environment:
      PREFECT_HOME: /app/.prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
    command: prefect server start --host 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/ready')"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  ingestion:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    command: python -m src.flux --deploy
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prefect-data:
