services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      # 'api' est le nom du service : Docker resout ce nom en interne
      API_URL: http://api:8000
    volumes:
      - ./data:/app/data
    command: >
      streamlit run src/dashboard.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ingestion:
    build: .
    volumes:
      - ./data:/app/data
    # Boucle simple : ingere, attend une heure, recommence.
    # Sera remplace par Prefect a l'etape suivante.
    command: >
      sh -c "while true; do
               python -m src.ingest_temps_reel || echo 'Echec ingestion';
               sleep 3600;
             done"
    restart: unless-stopped
